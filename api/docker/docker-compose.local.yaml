services:
  moonlit-db:
    image: postgres:15-alpine
    container_name: moonlit-db
    restart: always
    environment:
      POSTGRES_PASSWORD: moonlit123456
      POSTGRES_DB: moonlit
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - moonlit_rag

  moonlit-redis:
    image: redis:6-alpine
    container_name: moonlit-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --requirepass moonlit123456
    ports:
      - "6379:6379"
    networks:
      - moonlit_rag

  moonlit-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: moonlit-es
    volumes:
      - ./volumes/es/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=moonlit123456
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - TZ=Asia/Shanghai
    mem_limit: 8073741824
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:9200" ]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: always
    networks:
      - moonlit_rag

  moonlit-minio:
    image: quay.io/minio/minio:RELEASE.2023-12-20T01-00-02Z
    container_name: moonlit-minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=moonlit
      - MINIO_ROOT_PASSWORD=moonlit123456
      - TZ=Asia/Shanghai
    volumes:
      - ./volumes/minio_data:/data
    restart: always
    networks:
      - moonlit_rag

